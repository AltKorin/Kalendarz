name: kalendarz
services:
  app:
    build: .
    env_file: .env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_MEDIA_ROOT: /data/media  # logo lokali — na wolumenie, przeżywa deploy
    volumes: [kalendarz_data:/data]
    ports: ['${HTTP_PORT:-127.0.0.1:8095}:8000']
    restart: unless-stopped
    init: true
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/zdrowie/')"]
      interval: 20s
      timeout: 5s
      retries: 3
  # Cloudflare Tunnel założony z terminala (deploy/PROXMOX.md §4): deploy/cloudflared/config.yml + <uuid>.json.
  # deploy.sh włącza profil, gdy config.yml istnieje.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    volumes: [./deploy/cloudflared:/etc/cloudflared:ro]
    depends_on: [app]
    restart: unless-stopped
    mem_limit: 128m
volumes:
  kalendarz_data:
